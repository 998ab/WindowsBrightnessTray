name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after successful checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version=[regex]::Match((Get-Content src/version.h -Raw),'#define BRIGHTNESSTRAY_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (!$version) { throw 'Missing version.' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag and application version do not match.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -OutputDirectory build/release
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/tools | Out-Null
          $installer=Join-Path $PWD 'build/tools/inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $expected='8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch.' }
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Inno Setup signature is not valid.' }
          $destination=Join-Path $PWD 'build/tools/InnoSetup'
          $arguments=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$destination+'"'))
          $process=Start-Process $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode) { throw 'Inno Setup installation failed.' }
      - name: Package installer and portable archive
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test installation and uninstallation
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: build/dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="v$env:VERSION"
          $notes="docs/releases/$tag.md"
          if (!(Test-Path -LiteralPath $notes)) { throw 'Release notes are missing.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it.' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BrightnessTray $tag" --notes-file $notes --draft
          if ($LASTEXITCODE) { throw 'Could not create draft release.' }
          $assets=@(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw 'Expected installer, portable ZIP, and checksums.' }
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { throw 'Could not publish release.' }
